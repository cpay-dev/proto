name: Sync Rust protos to proto-rs

on:
  push:
    branches: [ authn ]
  workflow_dispatch: {}

permissions:
  contents: read

env:
  PROTOC_VERSION: "33.0"

jobs:
  publish:
    runs-on: ${{ matrix.os }}
    strategy:
      max-parallel: 1
      matrix:
        os: [ macos-15, ubuntu-24.04, ubuntu-24.04-arm ]

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Checkout proto-rs
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          token: ${{ secrets.PROTO_RS_PUB_WRITE_TOKEN }}
          repository: 'cpay-dev/proto-rs'
          ref: 'authn'
          path: 'proto-rs'

      - name: Compute protoc archive name
        id: protoc-arch
        run: |
          set -eu
          V="${PROTOC_VERSION}"
          OS="${{ runner.os }}"
          ARCH="${{ runner.arch }}"

          case "$OS" in
            Linux)  OS_ID="linux" ;;
            macOS)  OS_ID="osx" ;;
            *) echo "Unsupported OS: $OS" >&2; exit 1 ;;
          esac

          case "$ARCH" in
            X64)   CPU_ID="x86_64" ;;
            ARM64) CPU_ID="aarch_64" ;;
            *) echo "Unsupported arch: $ARCH" >&2; exit 1 ;;
          esac

          FILE="protoc-${V}-${OS_ID}-${CPU_ID}.zip"
          TAG="v${V}"

          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"   >> "$GITHUB_OUTPUT"

      - name: Restore protoc cache
        id: protoc-cache
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.protoc
          key: protoc-${{ steps.protoc-arch.outputs.tag }}-${{ steps.protoc-arch.outputs.file }}-${{ runner.os }}

      - name: Install protoc ${{ env.PROTOC_VERSION }}
        if: steps.protoc-cache.outputs.cache-hit != 'true'
        run: |
          set -eu
          mkdir -p "$HOME/.protoc"
          FILE="${{ steps.protoc-arch.outputs.file }}"
          TAG="${{ steps.protoc-arch.outputs.tag }}"
          URL="https://github.com/protocolbuffers/protobuf/releases/download/${TAG}/${FILE}"
          echo "Downloading $URL"
          curl -sSfL -o "$FILE" "$URL"
          unzip -o "$FILE" -d "$HOME/.protoc"
          rm -f "$FILE"
          echo "$HOME/.protoc/bin" >> "$GITHUB_PATH"
          echo "PROTOC_INCLUDE=$HOME/.protoc/include" >> "$GITHUB_ENV"

      - name: Add protoc to PATH and env (cache hit)
        if: steps.protoc-cache.outputs.cache-hit == 'true'
        run: |
          echo "$HOME/.protoc/bin" >> "$GITHUB_PATH"
          echo "PROTOC_INCLUDE=$HOME/.protoc/include" >> "$GITHUB_ENV"

      - name: Verify protoc
        run: |
          set -eu
          protoc --version
          test -d "$PROTOC_INCLUDE"

      - name: Build sources
        working-directory: 'proto-rs'
        run: |
          set -eu

          find crates/proto/src -type f ! -name 'lib.rs' -delete
          export PROTO_SRC_DIR="${{ github.workspace }}/src"
          cargo r -p proto-build

      - name: Validate Rust library builds
        working-directory: 'proto-rs'
        run: |
          set -eu
          cargo b -p cpay-proto

      - name: Install SSH signing key
        if: ${{ matrix.os == 'macos-15' }}
        env:
          SIGNING_KEY: ${{ secrets.EPTF_SIGNING_KEY }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "${SIGNING_KEY}" > "$HOME/.ssh/github-signing"
          chmod 600 "$HOME/.ssh/github-signing"

      - name: Commit and push to proto-rs
        if: ${{ matrix.os == 'macos-15' }}
        working-directory: 'proto-rs'
        env:
          BRANCH: "authn"
        run: |
          set -eu
          git config user.name "cpay.dev[bot]"
          git config user.email "238863254+EPTF@users.noreply.github.com"
          git config gpg.format ssh
          git config user.signingkey "$HOME/.ssh/github-signing"
          git config commit.gpgsign true
          git checkout -B "$BRANCH"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -S -m "[sync]: ${GITHUB_REF_NAME}@${GITHUB_SHA:0:7}"
          git push -u origin "$BRANCH"
