syntax = "proto3";

package cpay.api.v1.blockchain;

option go_package = "github.com/cpay-dev/proto-go/api/v1/blockchain";

enum ChainID {
  CHAIN_ID_UNSPECIFIED = 0;
  CHAIN_ID_ANY = 1;
  CHAIN_ID_ANY_BTC = 2;
  CHAIN_ID_ANY_EVM = 3;
  CHAIN_ID_ANY_SVM = 4;
  reserved 5 to 30;
  CHAIN_ID_BTC_BITCOIN = 31;
  reserved 32 to 40;
  CHAIN_ID_EVM_ETHEREUM = 41;
  CHAIN_ID_EVM_ARBITRUM = 42;
  CHAIN_ID_EVM_POLYGON = 43;
  CHAIN_ID_EVM_UNICHAIN = 44;
  reserved 45 to 75;
  CHAIN_ID_SVM_SOLANA = 76;
}
