syntax = "proto3";

package cpay.api.v1.wallet;

option go_package = "github.com/cpay-dev/proto-go/api/v1/wallet";

import "blockchain/v1/chain.proto";

service WalletService {
  rpc CreateWallet(CreateWalletRequest) returns (CreateWalletResponse);
}

message CreateWalletRequest {
  cpay.blockchain.v1.Chain chain = 1;
}

message CreateWalletResponse {
  uint32 kek_version = 1;
  bytes encrypted_private_key = 2;
  string public_key = 3;
}
