syntax = "proto3";

package cpay.api.v1.user;

option go_package = "github.com/cpay-dev/proto-go/api/v1/user";

import "google/protobuf/timestamp.proto";
import "api/v1/user/identity.proto";
import "api/v1/user/merchant.proto";

enum UserStatus {
  USER_STATUS_UNSPECIFIED = 0;
  USER_STATUS_PENDING_VERIFICATION = 1;
  USER_STATUS_ACTIVE = 2;
  USER_STATUS_INACTIVE = 3;
}

message User {
  string id = 1;
  UserStatus status = 2;
  string primary_merchant_id = 3;
  google.protobuf.Timestamp created_at = 4;
}

message UserProfile {
  User user = 1;
  repeated UserIdentity identities = 2;
  repeated Merchant merchants = 3;
}
