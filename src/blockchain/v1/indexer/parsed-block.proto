syntax = "proto3";

package cpay.blockchain.v1.indexer;

option go_package = "github.com/cpay-dev/proto-go/blockchain/v1/indexer";

import "blockchain/v1/indexer/block.proto";

message ParsedBlock {
  BlockBase block = 1;
  repeated ParsedTransfer transfers = 2;
}

message ParsedTransfer {
  string tx_hash = 1;
  string amount = 2;
  string from = 3;
  string to = 4;
  uint64 index = 5;
  oneof kind {
    bool native = 6;
    string contract = 7;
  }
}
