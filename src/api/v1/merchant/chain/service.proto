syntax = "proto3";

package cpay.api.v1.merchant.chain;

option go_package = "github.com/cpay-dev/proto-go/api/v1/merchant/chain";

import "api/v1/merchant/chain/chain.proto";

service ChainService {
  rpc ListChains(ListChainsRequest) returns (ListChainsResponse);
}

message ListChainsRequest {}

message ListChainsResponse {
  repeated Chain chains = 1;
}
