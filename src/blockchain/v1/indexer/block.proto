syntax = "proto3";

package cpay.blockchain.v1.indexer;

option go_package = "github.com/cpay-dev/proto-go/blockchain/v1/indexer";

import "blockchain/v1/indexer/types.proto";

message Block {
  Chain chain = 1;
  ConfirmationLevel confirmation_level = 2;
  uint64 block_number = 3;
  uint64 block_timestamp = 4;
  oneof transactions {
    EVMTransactions evm_transactions = 5;
  }
}

message EVMTransactions {
  bytes serialized_txs = 1;
  bytes serialized_receipts = 2;
}
