syntax = "proto3";

package cpay.api.v1.authn;

option go_package = "github.com/cpay-dev/proto-go/api/v1/authn";

import "api/v1/authn/provider.proto";

message InitAuthRequest {
  oneof method {
    ProviderMethod provider = 1;
    EmailMethod email = 2;
  }
}

message ProviderMethod {
  AuthProvider provider = 1;
}

message EmailMethod {
  string email = 1;
}

message InitAuthResponse {
  oneof continuation {
    ProviderContinuation provider = 1;
  }
}

message ProviderContinuation {
  string state = 1;
  string redirect_url = 2;
}
