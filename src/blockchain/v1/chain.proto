syntax = "proto3";

package cpay.blockchain.v1;

option go_package = "github.com/cpay-dev/proto-go/blockchain/v1";

enum Chain {
  CHAIN_UNSPECIFIED = 0;
  CHAIN_ANY = 1;
  CHAIN_ANY_BTC = 2;
  CHAIN_ANY_EVM = 3;
  CHAIN_ANY_SVM = 4;
  reserved 5 to 30;
  CHAIN_BTC_BITCOIN = 31;
  reserved 32 to 40;
  CHAIN_EVM_ETHEREUM = 41;
  CHAIN_EVM_ARBITRUM = 42;
  CHAIN_EVM_POLYGON = 43;
  CHAIN_EVM_UNICHAIN = 44;
  reserved 45 to 75;
  CHAIN_SVM_SOLANA = 76;
}
