syntax = "proto3";

package cpay.api.v1.user;

option go_package = "github.com/cpay-dev/proto-go/api/v1/user";

import "google/protobuf/timestamp.proto";
import "api/v1/authn/provider.proto";

enum IdentityStatus {
  IDENTITY_STATUS_UNSPECIFIED = 0;
  IDENTITY_STATUS_PENDING_VERIFICATION = 1;
  IDENTITY_STATUS_ACTIVE = 2;
  IDENTITY_STATUS_INACTIVE = 3;
}

message GoogleIdentityMetadata {
  bool email_verified = 1;
}

message UserIdentity {
  string id = 1;
  IdentityStatus status = 2;
  cpay.api.v1.authn.AuthProvider provider = 3;
  string identifier = 4;
  google.protobuf.Timestamp created_at = 5;
  oneof metadata {
    GoogleIdentityMetadata google = 20;
  }
}
